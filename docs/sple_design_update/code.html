<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
    </style>
</head>
<body class="antialiased min-h-screen relative overflow-hidden flex items-center justify-center">
<!-- Background Map/Content Simulation -->
<div class="absolute inset-0 z-0">
<img alt="Background context map showing a modern dark themed urban environment. Muted tones of deep charcoal and slate dominate the cityscape, with subtle glowing accents indicating active locations or routes. The overall mood is mysterious yet highly functional, reflecting a premium digital cartography experience." class="w-full h-full object-cover opacity-50" src="https://lh3.googleusercontent.com/aida/ADBb0ui5pGLwz0B2QC69UL_56zew3VPd8hPiJHA6JdNlmq5pcokgsVNxD6VHU2rLZMJgAEJUllpl7RBE911A6lI4zCrNi4KDrCMpVb4YMXBhVvig4JFgFXGhL-lX_KprRTCKm9H1jJ_szor-kxfVZeCDLNgU4lSk-Kbg-e9HL8H6XTkLM3HYgLKMvWnUV8x6wgZWQCxwBIMnutxNdOVdHukim8jDL9jRENE_ypRzeXFvGvCsYMEne9ZQfVqCNIw"/>
</div>
<!-- Overlay Dim -->
<div class="absolute inset-0 bg-overlay-dim z-10 backdrop-blur-sm"></div>
<!-- Main Modal Canvas -->
<div class="relative z-20 w-[90%] max-w-md mx-auto bg-glass-bg backdrop-blur-xl border border-outline-variant/30 rounded-3xl shadow-2xl overflow-hidden flex flex-col">
<!-- Modal Header -->
<div class="px-6 pt-6 pb-4 flex justify-between items-center border-b border-outline-variant/20">
<h2 class="font-headline-md text-headline-md text-on-surface">Analyze Post</h2>
<button class="p-2 rounded-full hover:bg-surface-variant/40 transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-6 flex flex-col gap-stack-lg">
<!-- URL Input Section -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant">Instagram Link</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">link</span>
<input class="w-full bg-surface-container-highest/50 border border-outline-variant/50 rounded-xl py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-sple-red focus:ring-1 focus:ring-sple-red transition-all" readonly="" type="text" value="https://instagram.com/p/CoF8x..."/>
</div>
</div>
<!-- Analysis Status / Preview Card -->
<div class="bg-surface-container-lowest/40 rounded-xl p-4 border border-outline-variant/30 flex items-center gap-4">
<div class="w-16 h-16 rounded-lg overflow-hidden shrink-0 relative bg-surface-container">
<img alt="Preview of a stylish modern cafe interior captured in a moody dark mode aesthetic. Rich textures of wood and concrete are illuminated by warm, focused lighting. The atmosphere is sophisticated and inviting, perfectly aligning with a premium lifestyle exploration app." class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0uhmZWV84EhyRL_I-fglbk8Pl3_Cku5Usf4qLAaEji1Avr0OfHYmb_VYbHnTljBZ4AG91HQ0mjKe0Pac3i65w2g2gBjRVbjxeMAxBGJpWCl2h55vmgtHEaTGmt7fDFXHBr1vUx-XVcFz9V9l8iBB_pazyr8zXt2X0MldmgF6CSaafwt0kNLnEAl6ysBvo0pCzY-VfW4L04wJHCcelBUIXpWm5x0YNgJBWWUcrMU3AmgiI9rXYCTkDLj18Og"/>
<div class="absolute inset-0 bg-smart-purple/20 flex items-center justify-center">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">analytics</span>
</div>
</div>
<div class="flex flex-col gap-1 flex-1">
<div class="flex justify-between items-center">
<span class="font-title-sm text-title-sm text-on-surface">Neo Cafe Tokyo</span>
<span class="font-label-sm text-label-sm text-guide-mint flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                            Verified
                        </span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant line-clamp-1">Shibuya-ku, Tokyo, Japan</span>
</div>
</div>
<!-- Folder Selection -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant">Save to Collection</label>
<div class="flex flex-col gap-2">
<!-- Option 1 -->
<label class="flex items-center justify-between p-3 rounded-xl hover:bg-surface-variant/30 cursor-pointer border border-transparent transition-colors group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-primary-container/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">bookmark</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Tokyo Trip 2024</span>
</div>
<div class="w-5 h-5 rounded-full border-2 border-sple-red flex items-center justify-center relative">
<div class="w-2.5 h-2.5 rounded-full bg-sple-red"></div>
</div>
</label>
<!-- Option 2 -->
<label class="flex items-center justify-between p-3 rounded-xl hover:bg-surface-variant/30 cursor-pointer border border-transparent transition-colors group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">coffee</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Cool Cafes</span>
</div>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant group-hover:border-on-surface-variant transition-colors"></div>
</label>
<!-- Create New -->
<button class="flex items-center gap-3 p-3 rounded-xl hover:bg-surface-variant/30 text-sple-red transition-colors w-full text-left">
<div class="w-10 h-10 rounded-lg border border-dashed border-sple-red/50 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add</span>
</div>
<span class="font-body-md text-body-md font-medium">New Collection...</span>
</button>
</div>
</div>
</div>
<!-- Modal Footer Actions -->
<div class="p-6 pt-0 flex gap-stack-md mt-2">
<button class="flex-1 py-3 px-4 rounded-full bg-surface-variant text-on-surface font-title-sm text-title-sm hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-2">
                Cancel
            </button>
<button class="flex-[2] py-3 px-4 rounded-full bg-sple-red text-on-primary-container font-title-sm text-title-sm hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-lg shadow-sple-red/20">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">map</span>
                Save to Map
            </button>
</div>
<!-- Toast Preview (Absolute positioning within modal to simulate it popping up) -->
<div class="absolute top-4 left-1/2 -translate-x-1/2 bg-surface-container-high border border-guide-mint/30 rounded-full py-2 px-4 shadow-lg flex items-center gap-2 z-50 opacity-0 pointer-events-none">
<span class="material-symbols-outlined text-guide-mint text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm text-on-surface">Saved to Tokyo Trip 2024</span>
</div>
</div>
</body></html>
