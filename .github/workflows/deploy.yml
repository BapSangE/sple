name: Sple Backend Deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      AWS_REGION: ap-northeast-2
      ECS_CLUSTER: default
      ECS_SERVICE: sple-backend-6440
      ECS_TASK_DEFINITION: default-sple-backend-6440
      ECR_REPOSITORY: sple-backend
      ALB_ARN: arn:aws:elasticloadbalancing:ap-northeast-2:740204038663:loadbalancer/app/ecs-express-gateway-alb-75822530/3347066d172cabd1
      ALB_HTTPS_LISTENER_ARN: arn:aws:elasticloadbalancing:ap-northeast-2:740204038663:listener/app/ecs-express-gateway-alb-75822530/3347066d172cabd1/50ec79dc8797e0c1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run backend contract tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test-ci.db
        run: |
          uv run pytest -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # --- 인프라 환경 변수 반영 로직 ---

      - name: Download current Task Definition
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_DEFINITION" --query taskDefinition | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .enableFaultInjection)' > task-definition.json

      # 2. 작업 정의 업데이트
      - name: Fill in the new image ID and Environment Variables in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: Main
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          environment-variables: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}
            INSTAGRAM_WEBHOOK_VERIFY_TOKEN=${{ secrets.INSTAGRAM_WEBHOOK_VERIFY_TOKEN }}
            META_APP_SECRET=${{ secrets.META_APP_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}
            NEXT_PUBLIC_NAVER_CLIENT_ID=${{ secrets.NEXT_PUBLIC_NAVER_CLIENT_ID }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
            NAVER_SEARCH_CLIENT_ID=${{ secrets.NAVER_SEARCH_CLIENT_ID }}
            NAVER_SEARCH_CLIENT_SECRET=${{ secrets.NAVER_SEARCH_CLIENT_SECRET }}

      # 3. ECS 서비스 배포
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Align ALB listener to running ECS task target group
        run: |
          set -euo pipefail

          echo "Checking AWS caller identity used by GitHub Actions..."
          aws sts get-caller-identity

          echo "Resolving the currently running ECS task..."

          TASK_ARN=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)

          if [ "$TASK_ARN" = "None" ] || [ -z "$TASK_ARN" ]; then
            echo "No running ECS task found for $ECS_SERVICE."
            exit 1
          fi

          TASK_IP=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].attachments[0].details[?name=='privateIPv4Address'].value | [0]" \
            --output text)

          if [ "$TASK_IP" = "None" ] || [ -z "$TASK_IP" ]; then
            echo "Could not resolve private IP for task $TASK_ARN."
            exit 1
          fi

          echo "Running ECS task IP: $TASK_IP"

          echo "Listing target groups attached to the backend ALB..."
          TARGET_GROUPS=$(aws elbv2 describe-target-groups \
            --load-balancer-arn "$ALB_ARN" \
            --query 'TargetGroups[].TargetGroupArn' \
            --output text)

          if [ -z "$TARGET_GROUPS" ] || [ "$TARGET_GROUPS" = "None" ]; then
            echo "No target groups found for ALB $ALB_ARN."
            echo "Check that the GitHub Actions AWS credentials allow elasticloadbalancing:DescribeTargetGroups."
            exit 1
          fi

          ACTIVE_TG=""
          for TG in $TARGET_GROUPS; do
            echo "Checking target group $TG..."
            MATCHING_STATE=$(aws elbv2 describe-target-health \
              --target-group-arn "$TG" \
              --query "TargetHealthDescriptions[?Target.Id=='$TASK_IP'].TargetHealth.State | [0]" \
              --output text)

            echo "$TG -> task target state: $MATCHING_STATE"

            if [ "$MATCHING_STATE" = "healthy" ]; then
              ACTIVE_TG="$TG"
              break
            fi
          done

          if [ -z "$ACTIVE_TG" ]; then
            echo "No healthy target group contains the running ECS task IP $TASK_IP."
            exit 1
          fi

          CURRENT_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$ALB_HTTPS_LISTENER_ARN" \
            --query 'Listeners[0].DefaultActions[0].TargetGroupArn' \
            --output text)

          echo "Current listener target group: $CURRENT_TG"
          echo "Active task target group: $ACTIVE_TG"

          if [ "$CURRENT_TG" != "$ACTIVE_TG" ]; then
            echo "Updating listener to the active target group..."
            aws elbv2 modify-listener \
              --listener-arn "$ALB_HTTPS_LISTENER_ARN" \
              --default-actions Type=forward,TargetGroupArn="$ACTIVE_TG"
          else
            echo "ALB listener already points to the active target group."
          fi

      - name: Smoke test backend health endpoint
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          set -euo pipefail

          HEALTH_URL="${BACKEND_HEALTH_URL:-https://api.sple-insta.com}"

          for path in /health /health/db; do
            echo "Checking $HEALTH_URL$path"

            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error "$HEALTH_URL$path"; then
                echo
                echo "$path passed on attempt $attempt."
                break
              fi

              if [ "$attempt" -eq 12 ]; then
                echo "$path did not become healthy after $attempt attempts."
                exit 1
              fi

              echo "$path is not ready yet. Retrying in 10 seconds..."
              sleep 10
            done
          done
